<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Obsidienne — Maison de spiritueux</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500;1,600&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#060607; --ink:#f3efe8; --mute:#8d8a85; --line:rgba(255,255,255,.09);
  --accent:#c9365a; --glow:rgba(201,54,90,.55);
  --serif:"Cormorant Garamond",Georgia,serif; --sans:Inter,system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg);color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
img{display:block;user-select:none;-webkit-user-drag:none}

/* ---------- header ---------- */
header{position:fixed;inset:0 0 auto 0;z-index:50;display:flex;justify-content:space-between;align-items:center;padding:22px 34px;pointer-events:none}
header>*{pointer-events:auto}
.logo{display:flex;flex-direction:column;gap:3px;cursor:pointer}
.logo b{font-family:var(--serif);font-weight:600;font-size:19px;letter-spacing:.42em}
.logo span{font-size:9px;letter-spacing:.32em;text-transform:uppercase;color:var(--mute)}
nav{display:flex;gap:8px;align-items:center}
nav button{font-size:11px;letter-spacing:.14em;text-transform:uppercase;padding:9px 16px;border:1px solid var(--line);border-radius:99px;background:rgba(10,10,12,.5);backdrop-filter:blur(8px);transition:.3s}
nav button:hover,nav button.on{border-color:rgba(255,255,255,.35)}
nav .dot{width:7px;height:7px;border-radius:50%;background:var(--accent);display:inline-block;margin-left:8px;box-shadow:0 0 10px var(--glow);transition:background .8s}

/* ---------- views ---------- */
.view{position:fixed;inset:0;transition:opacity .9s cubic-bezier(.7,0,.2,1),transform 1.1s cubic-bezier(.7,0,.2,1)}
.view.hidden{opacity:0;pointer-events:none;transform:scale(1.04)}

/* ---------- product view ---------- */
#product{display:grid;grid-template-columns:minmax(300px,30%) 1fr;align-items:center}
.ambient{position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(60% 70% at 62% 55%,color-mix(in srgb,var(--accent) 14%,transparent),transparent 70%);transition:background 1.2s}
.info{position:relative;z-index:5;padding:0 0 0 clamp(28px,5vw,80px);max-width:440px}
.kicker{font-size:10px;letter-spacing:.3em;text-transform:uppercase;color:var(--mute);margin-bottom:18px;display:flex;gap:10px;align-items:center}
.kicker i{width:22px;height:1px;background:var(--mute)}
h1{font-family:var(--serif);font-weight:500;font-size:clamp(46px,5.4vw,84px);line-height:.95;letter-spacing:-.01em}
h1 em{font-style:italic;color:var(--accent);transition:color .8s}
.desc{margin-top:22px;font-size:13.5px;line-height:1.7;color:#bdb8b0;font-weight:300;max-width:340px}
.specs{margin-top:26px;border-top:1px solid var(--line)}
.specs div{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--line);font-size:12px}
.specs dt{color:var(--mute);letter-spacing:.12em;text-transform:uppercase;font-size:10px}
.buy{margin-top:26px;display:flex;align-items:center;gap:20px}
.price{font-family:var(--serif);font-size:26px;white-space:nowrap}
.price small{font-family:var(--sans);font-size:10px;letter-spacing:.14em;color:var(--mute);text-transform:uppercase;margin-left:6px}
.cta{font-size:11px;letter-spacing:.18em;text-transform:uppercase;padding:13px 22px;border:1px solid rgba(255,255,255,.3);border-radius:99px;transition:.3s}
.cta:hover{background:var(--ink);color:#000}
.reveal>*{transition:opacity .7s,transform .9s cubic-bezier(.2,.7,.2,1)}
.reveal.out>*{opacity:0;transform:translateY(18px)}
.reveal>*:nth-child(2){transition-delay:.06s}.reveal>*:nth-child(3){transition-delay:.12s}
.reveal>*:nth-child(4){transition-delay:.18s}.reveal>*:nth-child(5){transition-delay:.24s}

/* stage + niche */
.stage{position:relative;height:100%;display:flex;align-items:center;justify-content:flex-start;padding-left:4vw}
.niche{position:relative;width:min(36vw,520px);height:min(84vh,860px);margin-top:4vh;overflow:hidden;
  background:#0d0d0f url(img/stone.jpg) center/cover;
  box-shadow:inset 0 0 120px 30px rgba(0,0,0,.92),inset 0 -40px 80px rgba(0,0,0,.8),0 40px 120px rgba(0,0,0,.9)}
.niche::before{/* spotlight cone */content:"";position:absolute;inset:0;
  background:radial-gradient(42% 30% at 50% 0%,rgba(255,250,240,.55),transparent 75%),
             radial-gradient(55% 60% at 50% 66%,rgba(255,245,235,.16),transparent 70%);mix-blend-mode:screen}
.niche::after{/* coloured side light */content:"";position:absolute;inset:0;
  background:linear-gradient(90deg,transparent 78%,color-mix(in srgb,var(--accent) 55%,transparent) 97%,color-mix(in srgb,var(--accent) 80%,#fff) 100%),
             linear-gradient(270deg,transparent 88%,color-mix(in srgb,var(--accent) 25%,transparent));
  mix-blend-mode:screen;transition:background 1s}
.lamp{position:absolute;top:0;left:50%;width:60px;height:6px;transform:translateX(-50%);background:#fff8e8;border-radius:0 0 6px 6px;box-shadow:0 0 30px 10px rgba(255,240,210,.5);z-index:2}
.floor{position:absolute;left:0;right:0;bottom:0;height:20%;background:linear-gradient(#141416,#050506);border-top:1px solid rgba(255,255,255,.08);z-index:1}
.bottle-wrap{position:absolute;left:50%;bottom:20%;transform:translateX(-50%);z-index:3;height:calc(48% * var(--s,1));display:flex;flex-direction:column;align-items:center;justify-content:flex-end}
.bottle-wrap img{height:100%;width:auto;max-width:min(30vw,420px);object-fit:contain;filter:drop-shadow(0 18px 18px rgba(0,0,0,.7)) contrast(1.06) saturate(1.08)}
.bottle-wrap .refl{position:absolute;top:100%;height:100%;transform:scaleY(-1);opacity:.28;filter:blur(1.5px);
  -webkit-mask-image:linear-gradient(to bottom,transparent 62%,#000 100%);mask-image:linear-gradient(to bottom,transparent 62%,#000 100%)}
.bottle-wrap{transition:opacity .6s,transform 1s cubic-bezier(.2,.7,.2,1)}
.bottle-wrap.out{opacity:0;transform:translate(-50%,30px) scale(.97)}
.halo{position:absolute;left:50%;bottom:16%;width:70%;height:10%;transform:translateX(-50%);background:radial-gradient(closest-side,rgba(255,240,220,.22),transparent);z-index:2}

/* pager */
.pager{position:absolute;right:34px;bottom:30px;z-index:10;display:flex;align-items:center;gap:18px;font-size:11px;letter-spacing:.2em;color:var(--mute)}
.pager b{color:var(--ink);font-weight:500}
.pager .bar{width:120px;height:1px;background:var(--line);position:relative}
.pager .bar i{position:absolute;left:0;top:0;height:1px;background:var(--ink);transition:width .8s}
.arrow{width:42px;height:42px;border:1px solid var(--line);border-radius:50%;display:grid;place-items:center;transition:.3s}
.arrow:hover{border-color:rgba(255,255,255,.4)}
.back{position:absolute;left:clamp(28px,5vw,80px);bottom:30px;z-index:10;font-size:10px;letter-spacing:.24em;text-transform:uppercase;color:var(--mute);transition:color .3s}
.back:hover{color:var(--ink)}

/* ---------- collection view ---------- */
#collection{display:flex;flex-direction:column;justify-content:flex-end;
  background:radial-gradient(80% 50% at 50% 100%,rgba(255,255,255,.04),transparent)}
.rail{display:flex;gap:18px;padding:110px 34px 0;overflow-x:auto;scroll-snap-type:x mandatory;scroll-padding-left:34px;scrollbar-width:none;flex:1;align-items:flex-start}
.rail::-webkit-scrollbar{display:none}
.cell{flex:0 0 clamp(150px,15vw,220px);scroll-snap-align:start;cursor:pointer;display:flex;flex-direction:column;gap:12px}
.cell .niche{width:100%;height:clamp(300px,52vh,520px);margin:0;box-shadow:inset 0 0 60px 14px rgba(0,0,0,.92),0 20px 60px rgba(0,0,0,.8)}
.cell .niche::after{background:linear-gradient(90deg,transparent 80%,color-mix(in srgb,var(--c) 50%,transparent) 98%,var(--c))}
.cell .bottle-wrap{height:calc(56% * var(--s,1))}
.cell .bottle-wrap img{max-width:85%}
.cell .lamp{width:34px;height:4px}
.cell .niche{transition:transform .6s cubic-bezier(.2,.7,.2,1)}
.cell:hover .niche{transform:translateY(-8px)}
.cell p{font-size:10px;letter-spacing:.22em;text-transform:uppercase;color:var(--mute)}
.cell h3{font-family:var(--serif);font-weight:500;font-size:22px;line-height:1}
.cell h3 em{color:var(--c)}
.coll-foot{display:flex;justify-content:space-between;align-items:flex-end;padding:26px 34px 30px;gap:20px}
.coll-foot h2{font-family:var(--serif);font-weight:500;font-size:clamp(34px,4vw,58px);line-height:1}
.coll-foot h2 em{color:var(--accent)}
.coll-foot p{font-size:12.5px;color:var(--mute);margin-top:8px;max-width:420px;line-height:1.6}
.hint{font-size:10px;letter-spacing:.22em;text-transform:uppercase;color:var(--mute);white-space:nowrap}

/* ---------- mobile ---------- */
@media (max-width:820px){
  header{padding:16px}
  .logo b{font-size:15px}
  nav button{padding:7px 12px;font-size:10px}
  html,body{overflow:auto}
  #product{position:fixed;overflow-y:auto;display:flex;flex-direction:column;align-items:stretch;padding-bottom:40px}
  #product .stage{order:0}#product .info{order:1}
  .pager{order:2;position:static!important;justify-content:space-between;padding:28px 16px 0}
  .back{order:3;position:static!important;padding:22px 16px 0;text-align:left}
  nav button{white-space:nowrap}
  .stage{height:auto;padding:76px 16px 0;justify-content:center}
  .niche{width:100%;height:62vh;margin:0}
  .bottle-wrap img{max-width:60vw}
  .info{padding:28px 16px 0;max-width:none}
  h1{font-size:54px}
  .desc{max-width:none}
  .pager .bar{width:60px}
  .rail{padding:84px 16px 0;gap:12px}
  .cell{flex-basis:44vw}
  .cell .niche{height:46vh}
  .coll-foot{padding:20px 16px 24px;flex-direction:column;align-items:flex-start}
}
@media (prefers-reduced-motion:reduce){*{transition-duration:.01s!important}}
</style>
</head>
<body>

<header>
  <div class="logo" onclick="show('collection')"><b>OBSIDIENNE</b><span>Maison de spiritueux</span></div>
  <nav>
    <button id="navColl" onclick="show('collection')">Collection</button>
    <button onclick="location.href='mailto:contact@exemple.fr'">Contact<i class="dot"></i></button>
  </nav>
</header>

<!-- PRODUCT -->
<section class="view hidden" id="product">
  <div class="ambient"></div>
  <div class="info reveal" id="info">
    <div class="kicker"><i></i><span id="pCat"></span></div>
    <h1 id="pName"></h1>
    <p class="desc" id="pDesc"></p>
    <dl class="specs" id="pSpecs"></dl>
    <div class="buy"><div class="price" id="pPrice"></div><button class="cta" onclick="location.href='mailto:contact@exemple.fr?subject='+encodeURIComponent('Demande : '+cur().brand+' '+cur().name.replace(/[*]/g,''))">Commander</button></div>
  </div>
  <div class="stage">
    <div class="niche">
      <div class="lamp"></div><div class="floor"></div><div class="halo"></div>
      <div class="bottle-wrap" id="pBottle"><img alt=""><img class="refl" alt="" aria-hidden="true"></div>
    </div>
  </div>
  <button class="back" onclick="show('collection')">← Toute la collection</button>
  <div class="pager">
    <button class="arrow" onclick="go(-1)" aria-label="Précédent">←</button>
    <span><b id="pIdx">01</b> / <span id="pTot"></span></span>
    <div class="bar"><i id="pBar"></i></div>
    <button class="arrow" onclick="go(1)" aria-label="Suivant">→</button>
  </div>
</section>

<!-- COLLECTION -->
<section class="view" id="collection">
  <div class="rail" id="rail"></div>
  <div class="coll-foot">
    <div><h2>La collection <em>nuit</em></h2><p>Seize spiritueux, un par famille. Rhums des Antilles, cognac, mezcal, gins et amers, chacun présenté dans sa niche de pierre.</p></div>
    <div class="hint">Faites défiler · Cliquez pour découvrir</div>
  </div>
</section>

<script>
/* Modifiez ici les produits. Le texte entre *étoiles* s'affiche en italique de couleur. */
const P=[
 {img:'rhum',cat:'Rhum agricole · Martinique',brand:'J. Bally',name:'J. Bally *7 ans*',deg:'45°',vol:'70 cl',c:'#d0882c',s:.82,desc:'Un rhum agricole vieilli sept ans en fût de chêne, dans sa carafe pyramide. Notes de fruits secs, de vanille et d’épices douces.'},
 {img:'cognac',cat:'Cognac',brand:'Gautier',name:'Gautier *VS*',deg:'40°',vol:'70 cl',c:'#2aa3c4',desc:'Un cognac vif et fruité, idéal en cocktail comme à la dégustation.'},
 {img:'whisky',cat:'Bourbon · Kentucky',brand:'Weller',name:'Weller *12 ans*',deg:'45°',vol:'70 cl',c:'#e09a3c',desc:'Un bourbon « wheated » au profil rond : caramel, miel et chêne toasté.'},
 {img:'tequila',s:.86,cat:'Tequila',brand:'1800',name:'1800 *Añejo*',deg:'38°',vol:'70 cl',c:'#c1622b',desc:'Une tequila 100 % agave vieillie en fût, aux notes de fruits secs et de caramel.'},
 {img:'mezcal',cat:'Mezcal · Oaxaca',brand:'400 Conejos',name:'400 *Conejos*',deg:'38°',vol:'70 cl',c:'#3fa3c9',desc:'Un mezcal d’agave espadín cuit en four de terre, à la fumée délicate.'},
 {img:'vodka',cat:'Vodka',brand:'Stoli',name:'Stoli *Elit*',deg:'40°',vol:'70 cl',c:'#cfd6e2',desc:'Une vodka ultra-premium filtrée à froid, d’une grande pureté.'},
 {img:'gin',cat:'Gin',brand:'Generous',name:'Generous *Purple*',deg:'44°',vol:'70 cl',c:'#b0306e',desc:'Un gin français floral et fruité, dans son flacon iconique.'},
 {img:'effervescent',cat:'Vin effervescent',brand:'Perlino',name:'Perlino *Prosecco*',deg:'11°',vol:'75 cl',c:'#c9b45a',desc:'Un prosecco frais et léger aux bulles fines, pour l’apéritif et le spritz.'},
 {img:'calvados',cat:'Calvados',brand:'Busnel',name:'Busnel *VSOP*',deg:'40°',vol:'70 cl',c:'#d1a447',desc:'Un calvados du Pays d’Auge, sur la pomme cuite et le bois.'},
 {img:'porto',cat:'Porto',brand:'Dalva',name:'Dalva *Dry White*',deg:'20°',vol:'75 cl',c:'#d8ad6a',desc:'Un porto blanc sec de 10 ans, à servir frais en apéritif.'},
 {img:'liqueur',s:.8,cat:'Liqueur',brand:'Golden Eight',name:'Golden *Eight*',deg:'25°',vol:'70 cl',c:'#e0912c',desc:'Une liqueur de poire dans sa carafe en forme de fruit.'},
 {img:'creme',cat:'Crème de fruits',brand:'Lejay',name:'Lejay *Cassis*',deg:'16°',vol:'70 cl',c:'#8a2a5a',desc:'La crème de cassis de Dijon d’origine, intense et fruitée.'},
 {img:'amer',cat:'Amer · Gentiane',brand:'Avèze',name:'A*vèze*',deg:'15°',vol:'100 cl',c:'#5fa344',desc:'Un apéritif à la gentiane d’Auvergne, à l’amertume franche.'},
 {img:'abv',cat:'Apéritif à base de vin',brand:'St Raphaël',name:'St Raphaël *Rouge*',deg:'',vol:'75 cl',c:'#c43636',desc:'Le quinquina historique, rond et légèrement amer.'},
 {img:'bitters',s:.62,cat:'Bitters',brand:'Peychaud’s',name:'Peychaud’s *Bitters*',deg:'35°',vol:'15 cl',c:'#d24a3a',desc:'L’amer aromatique de La Nouvelle-Orléans, indispensable au Sazerac.'},
 {img:'sucre',cat:'Sucre de canne',brand:'Dillon',name:'Dillon *Roux*',deg:'',vol:'70 cl',c:'#e3a63a',desc:'Un sirop de sucre de canne roux, pour les ti-punchs et les cocktails.'},
];
const $=s=>document.querySelector(s), fmt=n=>String(n).padStart(2,'0');
const nm=s=>s.replace(/\*(.+?)\*/g,'<em>$1</em>');
let i=0, view='collection', busy=false;
const cur=()=>P[i];

// collection rail
$('#rail').innerHTML=P.map((p,k)=>`
 <div class="cell" style="--c:${p.c};--s:${p.s||1}" onclick="open_(${k})">
  <div class="niche"><div class="lamp"></div><div class="floor"></div><div class="halo"></div>
   <div class="bottle-wrap"><img src="img/${p.img}.png" alt="${p.brand}" loading="lazy"><img class="refl" src="img/${p.img}.png" alt="" aria-hidden="true"></div></div>
  <p>${p.cat.split(' · ')[0]}</p><h3>${nm(p.name)}</h3>
 </div>`).join('');
$('#pTot').textContent=fmt(P.length);

function render(){
  const p=cur(), r=document.documentElement.style;
  r.setProperty('--accent',p.c); r.setProperty('--glow',p.c+'88');
  $('#pCat').textContent=p.cat; $('#pName').innerHTML=nm(p.name); $('#pDesc').textContent=p.desc;
  $('#pSpecs').innerHTML=[['Maison',p.brand],['Degré',p.deg||'—'],['Contenance',p.vol]].map(([a,b])=>`<div><dt>${a}</dt><dd>${b}</dd></div>`).join('');
  $('#pPrice').innerHTML='Sur demande<small>tarif pro</small>';
  $('#pBottle').style.setProperty('--s',p.s||1); $('#pBottle').querySelectorAll('img').forEach(im=>im.src=`img/${p.img}.png`);
  $('#pIdx').textContent=fmt(i+1); $('#pBar').style.width=((i+1)/P.length*100)+'%';
}
function go(d){
  if(busy) return; busy=true;
  $('#info').classList.add('out'); $('#pBottle').classList.add('out');
  setTimeout(()=>{ i=(i+d+P.length)%P.length; render();
    requestAnimationFrame(()=>{$('#info').classList.remove('out'); $('#pBottle').classList.remove('out')});
    busy=false },550);
}
function open_(k){ i=k; render(); show('product'); }
function show(v){
  view=v; $('#product').classList.toggle('hidden',v!=='product'); $('#collection').classList.toggle('hidden',v!=='collection');
  $('#navColl').classList.toggle('on',v==='collection');
  if(v==='product'){ $('#info').classList.add('out'); $('#pBottle').classList.add('out');
    setTimeout(()=>{$('#info').classList.remove('out'); $('#pBottle').classList.remove('out')},350); }
}
// keyboard, wheel, swipe
addEventListener('keydown',e=>{ if(view!=='product')return;
  if(e.key==='ArrowRight')go(1); if(e.key==='ArrowLeft')go(-1); if(e.key==='Escape')show('collection'); });
let wl=0; addEventListener('wheel',e=>{ if(view!=='product'||innerWidth<=820)return; const n=Date.now(); if(n-wl<900)return;
  if(Math.abs(e.deltaY)>30){wl=n; go(e.deltaY>0?1:-1)} },{passive:true});
let tx=null; $('#product').addEventListener('touchstart',e=>tx=e.touches[0].clientX,{passive:true});
$('#product').addEventListener('touchend',e=>{ if(tx===null)return; const dx=e.changedTouches[0].clientX-tx; if(Math.abs(dx)>50)go(dx<0?1:-1); tx=null });
// vertical wheel scrolls the rail horizontally
$('#rail').addEventListener('wheel',e=>{ if(Math.abs(e.deltaY)>Math.abs(e.deltaX)){ $('#rail').scrollLeft+=e.deltaY; e.preventDefault() } },{passive:false});
render(); show('collection');
P.forEach(p=>{const im=new Image(); im.src=`img/${p.img}.png`});
</script>
</body>
</html>
